// ─── TABS ────────────────────────────────────────────────────────────────────
function switchTab(btn, paneId){
  const tabBar=btn.parentElement;
  tabBar.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const container=tabBar.parentElement;
  container.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  const pane=document.getElementById(paneId);
  if(pane)pane.classList.add('active');
}

// ─── NAVIGATION ────────────────────────────────────────────────────────────
function showDashboard(){
  activeView='dashboard';
  document.getElementById('dash-view').classList.remove('hidden');
  document.querySelectorAll('.week-detail').forEach(e=>e.classList.remove('active'));
  renderDashboard();renderSidebar();
}
function showWeek(wid){
  activeView=wid;
  document.getElementById('dash-view').classList.add('hidden');
  document.querySelectorAll('.week-detail').forEach(e=>e.classList.remove('active'));
  const el=document.getElementById(`wv-${wid}`);
  el.classList.add('active');
  renderWeekDetail(wid);renderSidebar();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ─── TASK INTERACTIONS ────────────────────────────────────────────────────────
function toggleTask(wid,gName,ti,cbEl){
  const ws=getWS(wid),key=tk(gName,ti);
  if(!ws.tasks[key])ws.tasks[key]={done:false,note:'',images:[]};
  ws.tasks[key].done=!ws.tasks[key].done;
  saveState();
  const isDone=ws.tasks[key].done;
  cbEl.classList.toggle('checked',isDone);
  const item=cbEl.closest('.task-item');
  if(item)item.classList.toggle('done',isDone);
  const body=cbEl.closest('.tg-body');
  if(body){
    const hdr=body.previousElementSibling;
    const c=body.querySelectorAll('.task-cb.checked').length;
    const t=body.querySelectorAll('.task-cb').length;
    hdr.querySelector('.gc').textContent=`${c}/${t}`;
  }
  const p=weekProg(wid);
  const pb=document.getElementById(`wpb-${wid}`);
  const pl=document.getElementById(`wpl-${wid}`);
  if(pb){pb.style.width=p.pct+'%';pb.style.background=p.done===p.total&&p.total>0?'var(--success)':'var(--accent)';}
  if(pl)pl.textContent=`${p.done}/${p.total} tasks — ${p.pct}%`;
  renderSidebar();
  if(activeView==='dashboard')renderDashboard();
}
function toggleGroup(hEl){hEl.classList.toggle('collapsed');hEl.nextElementSibling.classList.toggle('hidden');}
function toggleNote(el){const a=el.nextElementSibling;a.classList.toggle('open');el.textContent=a.classList.contains('open')?'− note':'+ note';}
function saveTaskNote(el){
  const wid=parseInt(el.dataset.wid),g=el.dataset.g,ti=parseInt(el.dataset.ti),ws=getWS(wid),key=tk(g,ti);
  if(!ws.tasks[key])ws.tasks[key]={done:false,note:'',images:[]};
  ws.tasks[key].note=el.innerHTML;saveState();
}
function saveWeekNote(wid,el){getWS(wid).weekNote=el.innerHTML;saveState();}
function fmt(cmd,val){document.execCommand(cmd,false,val||null);}
function fmtCode(){const sel=window.getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0);const c=document.createElement('code');try{r.surroundContents(c);}catch{document.execCommand('insertHTML',false,`<code>${sel.toString()}</code>`);}}
function hPaste(e,el){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));}

// ─── IMAGES ────────────────────────────────────────────────────────────────
function triggerTaskImg(wid,g,ti){document.querySelector(`#ti-${wid}-${g.replace(/\s/g,'_')}-${ti} .img-zone input`)?.click();}
function triggerWeekImg(wid){document.getElementById(`wf-${wid}`)?.click();}
function handleTaskImgs(e,wid,g,ti){
  Array.from(e.target.files).forEach(f=>{const r=new FileReader();r.onload=ev=>{const ws=getWS(wid),key=tk(g,ti);if(!ws.tasks[key])ws.tasks[key]={done:false,note:'',images:[]};ws.tasks[key].images.push(ev.target.result);saveState();refreshTaskImgs(wid,g,ti);};r.readAsDataURL(f);});
}
function refreshTaskImgs(wid,g,ti){
  const ws=getWS(wid),imgs=(ws.tasks[tk(g,ti)]||{}).images||[];
  const grid=document.getElementById(`ti-imgs-${wid}-${g.replace(/\s/g,'_')}-${ti}`);
  if(grid)grid.innerHTML=imgs.map((img,ii)=>`<div class="img-thumb"><img src="${img}"><button class="rm" onclick="rmTaskImg(${wid},'${g}',${ti},${ii})">&#215;</button></div>`).join('');
}
function rmTaskImg(wid,g,ti,ii){const ws=getWS(wid);ws.tasks[tk(g,ti)].images.splice(ii,1);saveState();refreshTaskImgs(wid,g,ti);}
function handleWeekImgs(e,wid){Array.from(e.target.files).forEach(f=>{const r=new FileReader();r.onload=ev=>{const ws=getWS(wid);if(!ws.weekImages)ws.weekImages=[];ws.weekImages.push(ev.target.result);saveState();refreshWeekImgs(wid);};r.readAsDataURL(f);});}
function refreshWeekImgs(wid){const ws=getWS(wid);const grid=document.getElementById(`wi-${wid}`);if(grid)grid.innerHTML=(ws.weekImages||[]).map((img,ii)=>`<div class="img-thumb"><img src="${img}"><button class="rm" onclick="rmWeekImg(${wid},${ii})">&#215;</button></div>`).join('');}
function rmWeekImg(wid,ii){const ws=getWS(wid);ws.weekImages.splice(ii,1);saveState();refreshWeekImgs(wid);}

// ─── EXPORT ────────────────────────────────────────────────────────────────
let curExpWeek=null;
function openExportModal(){curExpWeek=null;document.getElementById('export-modal').classList.add('open');}
function exportWeek(wid){curExpWeek=wid;document.getElementById('export-scope').value='current';document.getElementById('export-modal').classList.add('open');}
function closeExportModal(){document.getElementById('export-modal').classList.remove('open');}
function runExport(){
  const fmt=document.querySelector('input[name="efmt"]:checked').value;
  const scope=document.getElementById('export-scope').value;
  let weeks=WEEKS;
  if(scope==='completed')weeks=WEEKS.filter(w=>weekStatus(w.id)==='complete');
  else if(scope==='current')weeks=curExpWeek?WEEKS.filter(w=>w.id===curExpWeek):(activeView!=='dashboard'?WEEKS.filter(w=>w.id===activeView):[WEEKS[0]]);
  if(fmt==='clipboard')exportHTML(weeks);
  else if(fmt==='docx')exportRTF(weeks);
  else exportText(weeks);
  closeExportModal();
}
function buildHTMLExport(weeks){
  let h=`<html><head><meta charset="UTF-8"><style>body{font-family:Calibri,sans-serif;max-width:800px;margin:0 auto;padding:20px}h1{font-size:22px;border-bottom:2px solid #1a4a8a;padding-bottom:8px}h2{font-size:18px;color:#1a4a8a;margin-top:24px}h3{font-size:14px;color:#444;margin:12px 0 4px}.wb{background:#e8eef8;color:#1a4a8a;padding:2px 8px;border-radius:3px;font-size:11px;font-family:monospace}.deliv{background:#fdf0e4;border:1px solid #e8c090;border-radius:4px;padding:8px 12px;margin:8px 0}.overview{background:#f5f5f5;border-left:3px solid #1a4a8a;padding:10px 14px;margin:10px 0}.concept{border:1px solid #ddd;border-radius:4px;padding:10px;margin:6px 0}.lab{border:1px solid #333;border-radius:4px;overflow:hidden;margin:12px 0}.lab-hdr{background:#1a1916;color:white;padding:8px 12px}.spec-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 4px}.task{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #eee}.cb{width:14px;height:14px;border:1.5px solid #999;border-radius:2px;display:inline-block;flex-shrink:0;margin-top:2px}.cb.done{background:#2d6a4f;border-color:#2d6a4f}.tl.done{text-decoration:line-through;color:#999}.note{font-size:13px;color:#555;margin:4px 0 4px 22px;border-left:2px solid #ddd;padding-left:8px}img{max-width:400px;border-radius:4px;margin:4px 0}</style></head><body>`;
  h+=`<h1>Digital Factory Twin — Course Notes</h1><p style="color:#666;font-size:13px">Exported: ${new Date().toLocaleDateString()}</p>`;
  weeks.forEach(w=>{
    const ws=getWS(w.id),p=weekProg(w.id);
    h+=`<h2><span class="wb">Week ${w.id}</span> ${w.title}</h2>`;
    if(w.deliverable)h+=`<div class="deliv"><strong>Deliverable:</strong> ${w.deliverable}</div>`;
    h+=`<div class="overview"><strong>Overview</strong><br>${w.overview}</div>`;
    h+=`<h3>Key Concepts</h3>`;
    w.concepts.forEach(c=>h+=`<div class="concept"><strong>${c.title}</strong> (${c.label})<br><small>${c.body}</small></div>`);
    h+=`<h3>Video Resources</h3><ul>`;
    w.videos.forEach(v=>h+=`<li><a href="${v.url}">${v.title}</a> — ${v.src}<br><small>${v.desc}</small></li>`);
    h+=`</ul>`;
    const ls=w.labSpec;
    h+=`<div class="lab"><div class="lab-hdr">Lab Specification</div><div style="padding:10px">`;
    if(ls.params){h+=`<div class="spec-lbl" style="color:#1a4a8a">Parameters</div><ul>`;ls.params.forEach(x=>h+=`<li>${x}</li>`);h+=`</ul>`;}
    if(ls.constraints){h+=`<div class="spec-lbl" style="color:#b5621a">Constraints</div><ul>`;ls.constraints.forEach(x=>h+=`<li>${x}</li>`);h+=`</ul>`;}
    if(ls.problems){h+=`<div class="spec-lbl" style="color:#8b3a9e">Problems to Solve</div><ul>`;ls.problems.forEach(x=>h+=`<li>${x}</li>`);h+=`</ul>`;}
    if(ls.outputs){h+=`<div class="spec-lbl" style="color:#2d6a4f">Required Outputs</div><ul>`;ls.outputs.forEach(x=>h+=`<li>${x}</li>`);h+=`</ul>`;}
    h+=`</div></div>`;
    h+=`<h3>Tasks (${p.done}/${p.total})</h3>`;
    w.groups.forEach(g=>{
      h+=`<p><strong>${g.name}</strong></p>`;
      g.tasks.forEach((t,ti)=>{
        const ttk=ws.tasks[tk(g.name,ti)]||{done:false,note:'',images:[]};
        h+=`<div class="task"><div class="cb ${ttk.done?'done':''}"></div><span class="tl ${ttk.done?'done':''}">${t}</span></div>`;
        if(ttk.note)h+=`<div class="note">${ttk.note}</div>`;
        (ttk.images||[]).forEach(img=>h+=`<div style="margin-left:22px"><img src="${img}"></div>`);
      });
    });
    if(ws.weekNote)h+=`<h3>Week Notes</h3><div class="note">${ws.weekNote}</div>`;
    (ws.weekImages||[]).forEach(img=>h+=`<img src="${img}" style="display:block;margin:8px 0">`);
  });
  h+=`</body></html>`;return h;
}
function exportHTML(weeks){
  const h=buildHTMLExport(weeks);
  navigator.clipboard.writeText(h).then(()=>showToast('HTML copied — paste into OneNote!')).catch(()=>{const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([h],{type:'text/html'})),download:'digital-twin-notes.html'});a.click();showToast('HTML file downloaded');});
}
function exportRTF(weeks){
  let c=`{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Calibri;}{\\f1 Calibri Light;}}\\widowctrl\\hyphauto\\fs24`;
  c+=`{\\f1\\fs32\\b Digital Factory Twin — Course Notes\\par}{\\f0\\fs20 Exported: ${new Date().toLocaleDateString()}\\par\\par}`;
  weeks.forEach(w=>{
    const ws=getWS(w.id),p=weekProg(w.id);
    c+=`{\\f1\\fs28\\b Week ${w.id}: ${w.title}\\par}`;
    if(w.deliverable)c+=`{\\f0\\fs20\\b Deliverable: }{\\f0\\fs20 ${w.deliverable}\\par}`;
    c+=`{\\f0\\fs20 Progress: ${p.done}/${p.total} (${p.pct}%)\\par\\par}`;
    c+=`{\\f0\\fs22\\b Overview\\par}{\\f0\\fs20 ${w.overview.replace(/[{}\\]/g,'')}\\par\\par}`;
    c+=`{\\f0\\fs22\\b Lab Spec\\par}`;
    (w.labSpec.outputs||[]).forEach(o=>c+=`{\\f0\\fs20 \\bullet  ${o.replace(/[{}\\]/g,'')}\\par}`);
    w.groups.forEach(g=>{
      c+=`{\\f0\\fs20\\b ${g.name}\\par}`;
      g.tasks.forEach((t,ti)=>{
        const ttk=ws.tasks[tk(g.name,ti)]||{done:false,note:''};
        c+=`{\\f0\\fs20 ${ttk.done?'[x]':'[ ]'} ${ttk.done?'\\strike ':''} ${t.replace(/[{}\\]/g,'')}${ttk.done?'\\strike0 ':''}\\par}`;
        if(ttk.note){const pt=ttk.note.replace(/<[^>]*>/g,'').replace(/[{}\\]/g,'');if(pt.trim())c+=`{\\f0\\fs18\\cf3    ${pt}\\par}`;}
      });
    });
    if(ws.weekNote){const pt=ws.weekNote.replace(/<[^>]*>/g,'').replace(/[{}\\]/g,'');if(pt.trim())c+=`{\\f0\\fs20\\b Week Notes:\\par}{\\f0\\fs20 ${pt}\\par}`;}
    c+=`\\line\\line`;
  });
  c+=`}`;
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([c],{type:'application/rtf'})),download:'digital-twin-notes.rtf'});a.click();
  showToast('RTF downloaded — open in Word, paste to OneNote');
}
function exportText(weeks){
  let t=`DIGITAL FACTORY TWIN — COURSE NOTES\nExported: ${new Date().toLocaleDateString()}\n${'='.repeat(50)}\n\n`;
  weeks.forEach(w=>{
    const ws=getWS(w.id),p=weekProg(w.id);
    t+=`WEEK ${w.id}: ${w.title.toUpperCase()}\n${'-'.repeat(40)}\n${w.desc}\n`;
    if(w.deliverable)t+=`Deliverable: ${w.deliverable}\n`;
    t+=`Progress: ${p.done}/${p.total} (${p.pct}%)\n\nOVERVIEW\n${w.overview}\n\nKEY CONCEPTS\n`;
    w.concepts.forEach(c=>t+=`  [${c.label}] ${c.title}: ${c.body}\n`);
    t+=`\nVIDEO RESOURCES\n`;
    w.videos.forEach(v=>t+=`  • ${v.title} — ${v.src}\n    ${v.url}\n    ${v.desc}\n`);
    t+=`\nLAB SPEC\n`;
    if(w.labSpec.params){t+='  Parameters:\n';w.labSpec.params.forEach(x=>t+=`    → ${x}\n`);}
    if(w.labSpec.constraints){t+='  Constraints:\n';w.labSpec.constraints.forEach(x=>t+=`    ! ${x}\n`);}
    if(w.labSpec.problems){t+='  Problems:\n';w.labSpec.problems.forEach(x=>t+=`    ? ${x}\n`);}
    if(w.labSpec.outputs){t+='  Required Outputs:\n';w.labSpec.outputs.forEach(x=>t+=`    ✓ ${x}\n`);}
    t+=`\nTASKS\n`;
    w.groups.forEach(g=>{
      t+=`  ${g.name.toUpperCase()}\n`;
      g.tasks.forEach((task,ti)=>{const ttk=ws.tasks[tk(g.name,ti)]||{done:false,note:''};t+=`    ${ttk.done?'[x]':'[ ]'} ${task}\n`;if(ttk.note){const pt=ttk.note.replace(/<[^>]*>/g,'');if(pt.trim())t+=`         Note: ${pt}\n`;}});
    });
    if(ws.weekNote){const pt=ws.weekNote.replace(/<[^>]*>/g,'');if(pt.trim())t+=`\nWEEK NOTES\n${pt}\n`;}
    t+=`\n${'='.repeat(50)}\n\n`;
  });
  navigator.clipboard.writeText(t).then(()=>showToast('Plain text copied!')).catch(()=>{const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([t],{type:'text/plain'})),download:'digital-twin-notes.txt'});a.click();showToast('Text file downloaded');});
}

// ─── UTILS ────────────────────────────────────────────────────────────────
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function clearAllData(){if(confirm('Reset all progress, notes, and images?')){localStorage.removeItem('dft_v2');state=buildDefault();showDashboard();showToast('All data cleared.');}}
document.getElementById('export-modal').addEventListener('click',function(e){if(e.target===this)closeExportModal();});

// ─── INIT ────────────────────────────────────────────────────────────────
function init(){
  const wv=document.getElementById('week-views');
  WEEKS.forEach(w=>{const d=document.createElement('div');d.className='week-detail';d.id=`wv-${w.id}`;wv.appendChild(d);});
  renderSidebar();renderDashboard();
}
init();
</script>
